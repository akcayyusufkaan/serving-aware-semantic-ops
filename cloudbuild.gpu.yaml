# Builds the vLLM image and then creates the L4 VM, so nothing has to wait in Cloud Shell.
# Started by launch/gcp_gpu_run.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, BASE=mirror.gcr.io/vllm/vllm-openai:v0.30.0, -t, $_IMAGE, .]
  - name: gcr.io/cloud-builders/docker
    args: [push, $_IMAGE]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: [launch/gcp_create_vm.sh]
    env:
      - IMAGE=$_IMAGE
      - BUCKET=$_BUCKET
      - CONFIG=$_CONFIG
      - VM=$_VM
      - ZONES=$_ZONES
      - MAX_RUN=$_MAX_RUN
      - SPOT_ARGS=$_SPOT_ARGS
substitutions:
  _VM: semops-l4
  _ZONES: us-central1-a us-central1-b us-central1-c europe-west4-a europe-west4-b europe-west4-c
  _CONFIG: configs/smoke_l4.yaml
  _SPOT_ARGS: ""
  _MAX_RUN: 3h
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
